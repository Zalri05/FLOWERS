<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just a Mini Game</title>

<style>
    body {
        text-align: center;
        background-color: pink;
        font-family: Arial, sans-serif;
        overflow: hidden;
        margin: 0;
        padding: 20px;
    }

    #game-container {
        position: relative;
        width: 90vw;
        max-width: 400px;
        height: 40vh;
        max-height: 280px;
        border: 2px solid red;
        margin: auto;
        overflow: hidden;
        background-color: white;
        touch-action: none;
    }

    #score-container {
        font-size: 1.3rem;
        font-weight: bold;
        position: absolute;
        top: 5px;
        left: 50%;
        transform: translateX(-50%);
        background: white;
        padding: 5px 10px;
        border-radius: 5px;
        border: 1px solid red;
        z-index: 100;
    }

    .heart {
    position: absolute;
    width: 30px;
    height: 30px;
    font-size: 30px;
    line-height: 30px;
    }

    #basket {
        position: absolute;
        width: 80px;
        height: 40px;
        background-color: brown;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 10px;
    }

    #message,
    #bouquet-page {
        display: none;
        margin-top: 20px;
    }

    .controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin-top: 15px;
    }

    .control-btn {
        width: clamp(50px, 10vw, 70px);
        height: clamp(50px, 10vw, 70px);

        display: flex;
        justify-content: center;
        align-items: center;

        font-size: clamp(24px, 4vw, 32px);
        font-weight: bold;
        line-height: 1;

        background-color: red;
        color: white;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        padding: 0;

        transition: transform 0.1s ease;
    }

    .control-btn:hover {
        transform: scale(1.1);
    }

    .control-btn:active {
        transform: scale(0.95);
    }

    #bouquet-page img {
        width: 90%;
        max-width: 350px;
        height: auto;
        display: block;
        margin: 0 auto;
        border-radius: 10px;
    }
</style>
</head>

<body>

<div id="game-page">
    <h1>Catch the Flowers! 🌻</h1>
    <p>Move the basket using the buttons below or Arrow Keys / A-D.</p>

    <div id="game-container">
        <div id="score-container">
            Score: <span id="score">0</span>
        </div>

        <div id="basket"></div>
    </div>

    <div class="controls">
        <button class="control-btn" id="left-btn">←</button>
        <button class="control-btn" id="right-btn">→</button>
    </div>
</div>

<div id="bouquet-page">
    <h1>Congratulations! 💐</h1>
    <p>You caught all of it and won a bouquet of flowers!</p>

    <img
        src="https://i5.walmartimages.com/seo/Fresh-Sunflower-Bouquet-Acrylic-Suncatcher-Ornament-for-Entry-Rustic_64f76d77-a25d-4036-a7bf-13f175080987.c260319098c96da71230c01327e02561.jpeg"
        alt="Bouquet of flowers"
    >

    <p>Hope you're having a nice day! ❤️</p>
</div>

<script>
    const basket = document.getElementById("basket");
    const gameContainer = document.getElementById("game-container");
    const scoreDisplay = document.getElementById("score");
    const gamePage = document.getElementById("game-page");
    const bouquetPage = document.getElementById("bouquet-page");

    const leftBtn = document.getElementById("left-btn");
    const rightBtn = document.getElementById("right-btn");

    let score = 0;
    let basketPosition = 50;

    function moveBasket(direction) {
        const step = 5;

        if (direction === "left") {
            basketPosition = Math.max(10, basketPosition - step);
        } else if (direction === "right") {
            basketPosition = Math.min(90, basketPosition + step);
        }

        basket.style.left = basketPosition + "%";
    }

    document.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();

        if (key === "arrowleft" || key === "a") {
            moveBasket("left");
        }

        if (key === "arrowright" || key === "d") {
            moveBasket("right");
        }
    });

    leftBtn.addEventListener("click", () => {
        moveBasket("left");
    });

    rightBtn.addEventListener("click", () => {
        moveBasket("right");
    });

    function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");

    // Random flower selection
    const flowers = ["🌻", "🌷", "🌸", "🌼", "🌺"];
    heart.textContent = flowers[Math.floor(Math.random() * flowers.length)];

    const heartLeft = Math.random() * 70 + 15;

    heart.style.left = heartLeft + "%";
    heart.style.top = "0px";

    gameContainer.appendChild(heart);

    function fall() {
        let heartTop = parseInt(heart.style.top) || 0;

        heartTop += 2;
        heart.style.top = heartTop + "px";

        if (heartTop > gameContainer.clientHeight - 50) {

            if (Math.abs(heartLeft - basketPosition) < 12) {
                score++;
                scoreDisplay.textContent = score;

                if (score >= 10) {
                    showBouquetPage();
                }
            }

            heart.remove();
            return;
        }

        requestAnimationFrame(fall);
    }

    requestAnimationFrame(fall);
    }

    let heartInterval = setInterval(createHeart, 750);

    function showBouquetPage() {
        clearInterval(heartInterval);

        gamePage.style.display = "none";
        bouquetPage.style.display = "block";
    }
</script>

</body>
</html>
